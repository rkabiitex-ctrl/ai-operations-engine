name: VEXT quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/auth.js
          node --check assets/js/features/automation.js
          node --check assets/js/features/sales-intelligence.js
          node --check assets/js/features/crm-advanced.js
          node --check assets/js/features/life-suite.js
      - name: Check Cloudflare Worker module syntax
        run: node --input-type=module --check < cloudflare-worker.js
      - name: Run architecture smoke checks
        run: node tests/architecture-smoke.mjs
